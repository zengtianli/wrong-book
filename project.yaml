name: wrong-book
name_en: Mistake Notebook
name_zh: 错题本
display_name: Mistake Notebook · 错题本
family: edu
form: ios
platforms: [iphone, ipad, mac, watch, vision]   # 跑在哪（正交于 form=源码住哪）；multiplatform.py audit 与 project.yml 对账；须与 sop.platforms 一致
lifecycle: active
bundle_id: cyou.tianli.wrongbook
origin: own
sop:
  accept:
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    account_lifecycle: bash scripts/accept/account_lifecycle.sh
    # 平台线启动冒烟：先起虚构演示学习库（scripts/demo/fixture.py：随机端口、随机密码、合成账号「小林」），
    # 再交给 Chapter 内置的 platform_launch（共享 sim_lane：仓外构建、无窗口模拟器 / Mac 静默启动不上屏、截图）
    launch_iphone: bash scripts/accept/launch.sh iphone
    launch_ipad: SOP_FUNCTIONAL_THIN=1 bash scripts/accept/launch.sh ipad
    launch_mac: bash scripts/accept/launch.sh mac
    launch_watch: bash scripts/accept/launch.sh watch
    launch_vision: bash scripts/accept/launch.sh vision
  # 第三段是手表 / Vision 的便宜编译车道（按 project.yml 各 target 源码清单 swiftc -typecheck，不起模拟器）
  test: bash Tests/check-local-regressions.sh && python3 Tests/cli_mistakes_test.py && python3 Tests/cli_phone_test.py && python3 Tests/cli_phone_product_test.py && bash Tests/check-platform-typecheck.sh
  account:
    mode: password
    rationale: 家长手机号验证码登录和注册，保留邮箱及旧密码；旧账号绑定保持同一学习库和订阅。原生实际短信闭环待本版本验证。
    verification_channels: [phone, email]
    phone_login: true
    inputs:
    - ../../../web/points/server.py
    - ../../../web/points/account_security.py
    - ../../../web/points/account_phone.py
    - ../../../web/points/requirements-subscriptions.txt
    - ../../../../../Dev/tools/dev/lib/tools/cloud/aliyun_sms.py
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  source:
  - Sources/**
  - Shared/**
  - Resources/**
  - Widget/**
  # 手表 app 随 iOS 包嵌入（WrongBook.app/Watch/），所以它是每条线的源码，不只是手表线的
  - Watch/**
  - ShareExtension/**
  - project.yml
  - '*.entitlements'
  - cli/mistakes
  test_inputs:
  - Tests/**
  - ref/**
  - test-contract.py
  - test_check_markdown_drift.py
  - scripts/tests/**
  - scripts/accept/**
  - Package.swift
  - cli/**
  media:
  - shots
  - ../02-审核/当前版本/02-视频/成片/public-preview
  media_meta: ../02-审核/当前版本/02-视频/成片/public-preview/provenance.json
  release: perf/asc-release.json
  # 一个 App 五条平台线（用户 2026-10-02：同名、同图标、同数据；「我都有，但你用模拟器好了」）。
  # 模拟器验收、证据标 environment=simulator；Mac 线是本机原生（同一 target，就在本仓，不委托别的组件）。
  # 手表 / Vision / Mac 还没上架（distribution: none）。预算：iPhone / iPad / Mac 沿用 Chapter 默认（150 MB · 0.5%）；
  # 手表与 Vision 是我们定的目标，引擎只判 memory_mb / cpu，size_mb / cold_launch_ms 由 README 与交接对照。
  platforms:
    iphone:
      input_normalization: {proof: perf/input-normalizations/finder-iphone.json, sha256: fc2d5b78b12bca125b009dc5657fd0fa8230432ef1e889929649dff2cd01016b}
      simulator: {device_type: iPhone-17-Pro}
      store_shots: shots/appstore/iphone/*.png
      distribution: app_store
    ipad:
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      store_shots: shots/appstore/ipad/*.png
      distribution: app_store
    mac:
      store_shots: shots/appstore/mac/*.png
      distribution: none
    watch:
      scheme: WrongBookWatch
      bundle_id: cyou.tianli.wrongbook.watchkitapp
      source: [Watch/**]
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      simulator: {device_type: Apple-Vision-Pro-4K}
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  measure:  # 模拟器无界面、不抢焦点，本人用电脑时也能测（Mac 线静默启动：不上屏、不进 Dock）
    # 起虚构学习库 → 逐线共享测量；iPhone 同一原件投影到 simulator/lightweight，不再另测 legacy。
    # 核当前输入与原件 SHA 后复用；锁/负载等待 0，忙或预算耗尽即返回 75，下个时段只补缺口。
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/simulator.json, perf/lightweight.json, perf/raw, perf/platforms, perf/projections]
    in_use: true
  runtime_note: 平台线模式（2026-10-02）：五条线都按模拟器验收（Mac 线本机原生），实体 iPhone 不回读、真机未验证；ASC 回读只核对已上传的 iOS 构建。
  # 给 Agent 的命令行：同一服务端 /api/* 的薄客户端（stdlib）。本机 Mac 版 .app 自带
  # Contents/Resources/bin/mistakes（project.yml 的构建阶段只在 macOS build 拷，iOS 包与归档不带），
  # cli/install.sh 按 bundle id 找到已装的 .app 链到 ~/.local/bin/mistakes。宿主 = 本组件 bundle_id。
  cli:
    commands:
    - mistakes
  # 界面功能对照（每项功能都能不点界面完成，2026-10-07）：从 Sources/ 与 Watch/ 的界面源码逐项列。
  # 邮箱注册/验证换绑/找回与修改已有密码走同族 treasury account（同一后端、同一账号，不在 mistakes 里再写一份）。
  # 手机端没法装命令行，用本机 Mac 版自带的 mistakes 对应；读回 mistakes version 不登录、只读。
  agent_cli:
    readback: mistakes version
    features:
    - name: 手机验证码登录
      command: mistakes account phone-login
    - name: 账号密码登录
      command: mistakes status
    - name: 先看看（不登录浏览）
      human: 只在 App 窗口里有意义：游客模式只显示随包的空白清单，没有服务端数据
    - name: 手机号注册
      command: mistakes account phone-register
    - name: 邮箱注册
      command: treasury account register
    - name: 忘记密码（手机号）
      command: mistakes account phone-recover
    - name: 忘记密码（邮箱）
      command: treasury account recover
    - name: 阅读用户协议与隐私政策
      human: 只在窗口里有意义：打开随包正文或网页，同帮助页
    - name: 错题本列表（含下拉刷新）
      command: mistakes questions
    - name: 学科筛选
      command: mistakes questions
    - name: 只看待巩固
      command: mistakes questions
    - name: 搜索题目或来源（含 ⌘K）
      command: mistakes questions
    - name: 打开题目练习页
      command: mistakes lesson
    - name: 练习答题
      human: 要孩子本人作答：练习结果是孩子的学习记录，判题与写存档随作答在练习页里完成，命令不代答
    - name: 复习列表
      command: mistakes questions
    - name: 今天的任务进度与连续天数
      command: mistakes progress
    - name: 拍照导入
      human: 要真人用实机相机拍；已有图片文件时用 mistakes import
    - name: 从相册或文件选图片导入
      command: mistakes import
    - name: 选科目、学年、学期、年级、卷种与备注
      command: mistakes import
    - name: 调整页序与删页
      command: mistakes import
    - name: 导入前的页面预览
      human: 只在窗口里有意义：上传前在屏幕上看缩略图
    - name: 同意 AI 识别并上传
      command: mistakes import
    - name: 上传与识别进度
      command: mistakes job
    - name: AI 识别额度与订阅状态
      command: mistakes status
    - name: 刷新额度与订阅
      command: mistakes status
    - name: 加载订阅方案并购买
      human: Apple 付款面板须真人在设备上确认
    - name: 恢复购买
      human: StoreKit 绑定设备上登录的 Apple 账户，须真人在设备上确认
    - name: 管理或取消订阅
      human: 跳到 App Store 的订阅管理页，由本人操作
    - name: 每日提醒的开关与时间
      missing: 开关和时间（remind_enabled、remind_hour）在可随 iCloud 迁移的配置清单里，本机装着的 Mac 版读写同一个 iCloud 键值存储，够得着但没有命令。需要 mistakes 加 config status / export / import（转调 Mac 版 App 里的共用配置命令）；手机那份要两边都开「使用 iCloud 记住配置」才跟得到，通知由各设备的 App 自己排
    # 离线副本与登录态：手机、平板、Vision 上的那份只在设备本机，记 device；Mac 版就装在本机，它那份在这台 Mac 上 App 的
    # 沙盒容器里，够得着但还没有命令，另列「（Mac 版）」留 missing（与下面「配置与更新」面板同一口径，不让 device 盖住够得着的缺口）。
    - name: 同步错题（顶栏按钮与 ⌘R）
      device: 只把服务端的个人课程包下载进这台设备的离线副本（App 自己的本机目录，按账号分区），不上传任何东西；副本新不新只有这台设备知道，命令与后端读不到。服务端那份用 mistakes lessons / questions 直读。范围是手机、平板、Vision；Mac 版另列
    - name: 同步错题（Mac 版）
      missing: Mac 版的离线副本在这台 Mac 上 App 的沙盒容器里（Application Support，按账号分区），够得着但没有命令。需要 mistakes 加 offline sync（转调 Mac 版 App 的可执行文件拉一次课程包，并读回副本清单与同步结果）
    - name: 离线课程包清单
      command: mistakes lessons
    - name: 离线课程现在检查更新
      device: 重拉这台设备的离线课程副本，并显示「已是最新 / 正在拉…」；这句状态只在 App 运行时的内存里，设备不上报，命令与后端读不到。服务端清单用 mistakes lessons 直读。范围是手机、平板、Vision；Mac 版另列
    - name: 离线课程现在检查更新（Mac 版）
      missing: 与「同步错题（Mac 版）」是同一个动作的另一个入口（都是强制重拉这台 Mac 上的副本），够得着但没有命令。同样需要 mistakes 加 offline sync（转调 Mac 版 App）
    - name: 停用本机课程副本
      device: 只停用这台设备上的离线副本（清本机的账号指针，个人文件留在本机），不动服务端；命令与后端够不到设备里那份。范围是手机、平板、Vision；Mac 版另列
    - name: 停用本机课程副本（Mac 版）
      missing: Mac 版的账号指针在这台 Mac 上 App 的沙盒偏好里，够得着但没有命令。需要 mistakes 加 offline reset（转调 Mac 版 App 清它自己的指针，个人文件照留，须 --yes）
    - name: 账号信息
      command: mistakes status
    - name: 手机绑定与换绑
      command: mistakes account phone-bind
    - name: 邮箱验证与换绑
      command: treasury account email-bind
    - name: 设置登录密码（未设过）
      command: mistakes account password-set
    - name: 修改登录密码
      command: treasury account passwd
    - name: 退出登录
      device: 登录态就是这台设备上那枚会话 Cookie 加本机缓存。退出时服务端只回一个清 Cookie 的响应，不留会话记录，App 再清本机课程指针并让手表下线；命令自己不保存登录态，命令与后端够不到设备里那份。范围是手机、平板、Vision；Mac 版另列
    - name: 退出登录（Mac 版）
      missing: Mac 版的会话 Cookie 在这台 Mac 上 App 的沙盒容器里，够得着但没有命令。需要 mistakes 加 app logout（转调 Mac 版 App 清它自己的登录态与课程指针，须 --yes）；mistakes 自己不保存登录态，替不了这一步
    - name: 注销账号
      command: mistakes account delete
    - name: 刷新注销进度
      command: mistakes account deletion-status
    - name: 联系支持与完整隐私说明链接
      human: 只在窗口里有意义：打开网页或邮件
    # 「配置与更新」面板（共享生命周期模块）。手机、平板、Vision 上的那份只在设备本机，记 device；
    # Mac 版就装在本机（mistakes 所在的那个 App），同一面板的状态在这台 Mac 上，够得着但还没有命令，另列为 missing。
    - name: 使用 iCloud 记住配置
      device: 手机、平板、Vision 上「配置与更新」面板里的开关，存在那台设备的本机偏好里，设备不上报；命令与后端够不到
    - name: 导出配置
      device: 手机、平板、Vision 上导出的是那台设备的本机偏好，经设备上的系统文件面板存到本人选的位置；命令与后端读不到设备里那份
    - name: 导入配置
      device: 手机、平板、Vision 上写的是那台设备的本机偏好，文件经设备上的系统文件面板选取；命令与后端写不到设备里那份
    - name: 检查更新
      device: 手机、平板、Vision 上拿本机已装版本去比 App Store 上的版本，结论只显示在那台设备上，不留存也不上报；命令与后端读不到
    - name: 升级到新版
      device: 手机、平板、Vision 上是「前往 App Store」，由系统在那台设备上安装；命令与后端替它装不了
    - name: 使用 iCloud 记住配置（Mac 版）
      missing: Mac 版的开关在这台 Mac 上，够得着但没有命令。需要 mistakes 加 config sync（转调 Mac 版 App 里的共用配置命令；沙盒加 iCloud 键值存储的同步要由 App 自己的可执行文件来跑）
    - name: 导出配置（Mac 版）
      missing: 需要 mistakes 加 config status / config export（转调 Mac 版 App 里的共用配置命令）
    - name: 导入配置（Mac 版）
      missing: 需要 mistakes 加 config import（转调 Mac 版 App 里的共用配置命令）
    - name: 检查更新（Mac 版）
      missing: 需要 mistakes 加 update check（转调 Mac 版 App 里的共用更新命令；Mac 版读的是 iCloud Drive 里的私有发行记录，目录授权只在 App 自己手里）
    - name: 升级到新版（Mac 版）
      missing: 需要 mistakes 加 update install（转调 Mac 版 App 里的共用更新命令）；现在只能在面板里点「打开发行包」
    - name: 选择 iCloud Drive 更新目录…（Mac 版）
      human: 要真人在系统目录面板里选目录并授权；授权只保存在这台 Mac
    - name: Apple Watch 只读摘要（待巩固、今天几题、连续几天）
      command: mistakes progress
    - name: Apple Watch 先复习哪几类
      command: mistakes wrongs
    - name: Apple Watch 表盘复杂功能
      human: 要真人在表盘上摆放；显示的数字同 mistakes progress
  runtime:
    kind: ios
    readback: builtin:asc-device
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/wrong-book
    rationale: 整理自己的错题，留给下一次更有把握的作答。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
