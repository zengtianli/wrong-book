name: wrong-book
origin: own
lifecycle: active
form: ios

one_liner: >-
  错题本随身版 —— 装着 ~/Edu 的练习引擎离线做题,错题按「题型」复习出同类新题;另带「录卷子」:
  系统文档扫描器拍整份卷子传回学习库,服务端逐页自动读错题入库(与网页同一条链);整卷复盘留 Mac /exam(可选)

stack: swift-ui
notes: |
  **「录卷子」这一屏（2026-08-31 加，2026-09-01 接上自动链）**：整卷入库链的手机端。
  链路：`Sources/PaperScan*.swift` → `POST edu.tianli.cyou/api/paper_page`（一页一发）
      → 服务端登记成错题图 + 派 auto 作业 → `edu-wrong-worker` → `wrong_ingest.py auto`（读整页 → 逐道入库）
      → app 轮询 `GET /api/job` 画出「录进 N 道 / 跳过 M 道」。
      扫描件同时留 `papers/`，想整卷复盘再 `paper_ingest.py pull <slug>` → `/exam`（可选）。
  用户拍板（2026-09-01）：「web 是正品，app 是附属」—— 这一屏和网页 wrong.html 是同一条链，app 不做原生识别。
  ⚠ 2026-09-01 订正：**这一屏此前对生产传必然 413**
  （nginx `client_max_body_size` 原为 1m，只装得下 ≈780KB 的 JPEG，而客户端压到 2.9MB 才收手）；
  现已改为由 `server.py::WRONG_BODY_MAX` 派生的 17m 并带 live gate，实测 3.87MB body 打得进 app。
  `-papertest` 打本地过了不算数，传输层上限只有走公网才验得到。
  单道错题**不走这儿**，走网页 `wrong.html`（2026-09-01 起全自动：传图 → 整页读 → 全部自动入库，
  不要密码、不选知识点，读不准的跳过，归不到课的落 `math-inbox` / `chinese-inbox`）。
  ⚠ slug 的规则在两侧各有一份（这边拼、服务端 `PAPER_SLUG_RE` 校验）——
  服务端收紧了而这边没跟，表现是传的时候一句「卷子编号不对」。守它的是
  `-papertest` 自检通道（跑的是生产同一份 Api.paperPage + 压图器，不是替身）。


  **不用 SwiftUI 重写练习引擎。** app 是个壳,题在 WKWebView 里跑
  ~/Edu/engine/practice.js（判题 verify() / 组卷权重 nextGen() / 错题本两层 /
  勋章判定 PRED / 上瘾机制五件套,1200+ 行,题库内联进每个 HTML）。
  原生重写 = 第二份判题逻辑,和 bank.db / badges.json 必然漂移。

  **错题本记的是题型,不是那一道原题**（~/Edu 用户钦定:「为了防止记住答案,
  错的题目也要变下」）。所以原生模型里**没有 ans / options** —— 想重放也放不出来。
  点「复习」走引擎自己的入口 window.__PRACTICE__.review(gid),由它出同类新题。

  离线是这个 app 存在的理由:页面随包发（sync-lessons.sh → ~/Edu/engine/app_pack.py,
  与上线共用同一道 PII 门）。不需要离线就该用 /appweb 加书签,不该做原生 app。

  和 ~/Apps/ios/points-deck 是**两个 app**（2026-08-28 用户拍板「分开2个app,
  一个关注错题,一个关注积分」）:这边管学习,那边管账本。
  两边共用 edu.tianli.cyou 的同一套账号与 cookie,但各装各的、各登各的。

  方案全文 ~/Dev/wiki/handoffs/dev/ios-fleet-landing/06-练习平台app方案.md
