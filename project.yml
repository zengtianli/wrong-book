name: WrongBook
options:
  bundleIdPrefix: cyou.tianli
  # visionOS 26：与成长小金库同一口径（WidgetKit 在 visionOS 26 之前不可用；本 App 主 target 没有小组件，
  # 取同一个版本省得两个 edu App 各有一套）。watchOS 11：手表 App 与表盘复杂功能是独立 target（见文件末尾；
  # xcodegen 不许把 watchOS 写进 supportedDestinations）。
  deploymentTarget: { iOS: "18.0", macOS: "15.0", visionOS: "26.0", watchOS: "11.0" }
  createIntermediateGroups: true
settings:
  base:
    # 名字与版本放全局：手表 App 与复杂功能必须与 iPhone App 同名、同版本（App Store 拒收不一致的包）。
    APP_DISPLAY_NAME: 错题本
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "19"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B9LJH93LA4
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.0"
targets:
  WrongBook:
    type: application
    # iPhone / iPad / Mac / Vision Pro 是同一个 target（同名、同图标、同 bundle id、同一套数据）；
    # Apple Watch 是下面单独的 WrongBookWatch，iOS 构建时嵌进 WrongBook.app/Watch/。
    supportedDestinations: [iOS, macOS, visionOS]
    dependencies:
      # 手表 App 只随 iOS 包走（WrongBook.app/Watch/）；Mac 与 visionOS 包里不带
      - target: WrongBookWatch
        destinationFilters: [iOS]
    # Public distributions contain an empty personal library, never a user's courses.
    preBuildScripts:
      - script: bash "$PROJECT_DIR/sync-lessons.sh"
        name: 验证公开包不含个人资料
        basedOnDependencyAnalysis: false
    # 给 Agent 的命令行 mistakes 随本机 Mac 版一起装：Contents/Resources/bin/mistakes，
    # cli/install.sh 按 bundle id 找到已装的 .app 再链到 ~/.local/bin。只在 macOS 的 build 动作里拷
    # （签名在所有构建阶段之后，脚本会被封进签名）；iOS 包和任何归档（ACTION=install：App Store /
    # TestFlight）都不带，上架包内容不受影响。
    postBuildScripts:
      - name: 本机 Mac 版带上 mistakes 命令行
        basedOnDependencyAnalysis: false
        # 不声明 inputFiles/outputFiles：Xcode 会先建好输出所在目录（iOS 包里会多一个空的 bin/），
        # 缺输入文件时连 iOS 归档也会失败；本阶段每次都跑，不需要依赖分析。
        script: |
          if [ "$PLATFORM_NAME" != "macosx" ] || [ "$ACTION" = "install" ]; then
            echo "skip: mistakes CLI only ships in local macOS builds ($PLATFORM_NAME/$ACTION)"
            exit 0
          fi
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
          mkdir -p "$dest"
          install -m 755 "$PROJECT_DIR/cli/mistakes" "$dest/mistakes"
    sources:
      # 总部共享：macOS 侧给 iOS-only SwiftUI 修饰符提供同名 no-op，调用点不改（multiplatform.py 注入）
      - path: Shared/PlatformCompat.swift
      # 平台验收车道契约（lane-ready 日志、iPad 横屏、Mac 静默启动与离屏截图），不传 -lane_* 时零行为
      - path: Shared/LaneSignal.swift
      # iPhone → 手表登录态转交（Mac / Vision 上编译为空操作）
      - path: Shared/WatchCookieLink.swift
      - path: Shared/RemoteUI.swift
      - path: Shared/AppLifecycle.swift
      - path: Shared/AppConfiguration.swift
      - path: Shared/AppLifecycleMobile.swift
      # Mac 版可执行文件里的命令层（mistakes config … 转调到它）：两份都整份包在 #if os(macOS) 里，
      # iPhone / iPad / Vision 编出来是空的。AppLifecycleUI 只为它带的安装器类型而编，不调 install，不加菜单。
      - path: Shared/AppLifecycleUI.swift
      - path: Shared/AppLifecycleCLI.swift
      - path: Shared/AppShortcuts.swift
      - path: Sources
      # ⚠ 图标资产必须在这儿列出来。漏了的表现是**编译通过、装机通过、桌面白板**——
      #   ASSETCATALOG_COMPILER_APPICON_NAME 指向一个不在工程里的 catalog,
      #   actool 根本没被调起,全程零报错。
      - path: Resources/Assets.xcassets
      # 练习页 —— folder 引用(不是 group),进包后保持 primary-*/ 子目录结构
      - path: Resources/Lessons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.wrongbook
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Configuration.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xr*]": Configuration.entitlements
        # ── Mac 侧（multiplatform.py 注入）：沙盒 + 加固运行时是 TestFlight for Mac 的硬门槛；
        #    entitlements 按 sdk 分开给，iOS 的 profile 不认 app-sandbox 这个键。
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.entitlements
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx*]": "$(inherited) APP_LIFECYCLE_KVS"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        # 缺这一行的表现是**点「扫描卷子」当场闪退**，而崩溃日志只说 access violation，
        # 一个字都不提「你没声明用途」。VisionKit 的文档扫描器走的就是相机权限。
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄错题照片，确认后上传到你自己的学习库用于识别和复习。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 从相册里挑已经拍好的卷子照片上传。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 出口合规:声明不使用非豁免加密 → TestFlight 每次传新包不再弹问卷,
        # 直接进 Ready to Test(缺这行则每个 build 都要人去网页点一次)。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
      configVariants: []

  # ── Apple Watch ───────────────────────────────────────────────────────────
  # 抬腕看的只读一面：待巩固几类、今天做了几题、连续几天、先复习哪几类；不做题（练习引擎是网页，
  # 手表没有 WebKit）。登录态由 iPhone 经 WatchConnectivity 递过来（Shared/WatchCookieLink.swift，
  # Sources/WatchLink.swift）。错题的解析与 iPhone 共用同一份文件（WrongBook / Lessons / Api），不另写一套。
  WrongBookWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared/PlatformCompat.swift
      - path: Shared/LaneSignal.swift
      - path: Shared/WatchCookieLink.swift
      - path: Sources/Api.swift
      - path: Shared/RemoteUI.swift
      - path: Sources/AccountDeletion.swift
      - path: Sources/PaperRequestSession.swift
      - path: Sources/LessonPaths.swift
      - path: Sources/Lessons.swift
      - path: Sources/WrongBook.swift
      - path: Sources/ReviewDigest.swift
      - path: Sources/Theme.swift
      - path: Sources/WatchLink.swift
      - path: Watch/App
      - path: Watch/Common
      # ⚠ 同主 App：资产目录不列进来，手表包零报错地没有图标。AppIcon 里那张 platform: watchos 的 1024 只有手表 actool 认。
      - path: Resources/Assets.xcassets
    dependencies:
      - target: WrongBookWatchWidget
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: cyou.tianli.wrongbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.wrongbook.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 手表的导航标题取全局强调色：AccentColor 是产品卡主题红（iPhone 靠 .tint 盖成墨绿），
        # 在黑底手表上红标题像报错，手表单独用同色相提亮的绿（= WatchInk.accent）
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: WatchAccent
        CODE_SIGN_ENTITLEMENTS: Watch.entitlements
    scheme: {}
  # 表盘复杂功能：圆形 / 矩形 / 单行 / 表角四种，读手表 App 刷新时写进钥匙串的那份摘要（不联网）。
  WrongBookWatchWidget:
    type: app-extension
    platform: watchOS
    info:
      path: Watch/Widget-Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      # 摘要只是一份 Codable 投影（ReviewDigest），复杂功能不碰存档解析、不联网
      - path: Sources/ReviewDigest.swift
      - path: Sources/Theme.swift
      - path: Watch/Common
      - path: Watch/Complications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.wrongbook.watchkitapp.widget
        CODE_SIGN_ENTITLEMENTS: WatchWidget.entitlements
